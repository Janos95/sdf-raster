<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SDF Raster Viewer</title>
    <link rel="stylesheet" href="styles.css">
    <script>
      (() => {
        const reloadKey = "prospero-coi-reload";
        if (window.crossOriginIsolated || !("serviceWorker" in navigator)) {
          window.sessionStorage.removeItem(reloadKey);
          return;
        }
        navigator.serviceWorker.register("coi-serviceworker.js").then(() => {
          if (window.sessionStorage.getItem(reloadKey)) return;
          window.sessionStorage.setItem(reloadKey, "1");
          window.location.reload();
        }).catch(() => {});
      })();
    </script>
    <script defer src="viewer.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <nav class="page-nav" aria-label="Primary">
        <div class="nav-group">
          <a class="nav-link" href="../../index.html">Home</a>
          <a class="nav-link" href="../../blog/index.html">Blog</a>
        </div>
      </nav>

      <header class="hero">
        <h1>SDF Raster Viewer</h1>
      </header>

      <section class="viewer-app" aria-label="SDF raster viewer">
        <section class="viewer-pane" aria-label="Rendered output">
          <canvas id="viewport" width="1024" height="1024"></canvas>
        </section>
        <section class="control-pane" aria-label="Viewer controls">
          <textarea id="text-input" spellcheck="false"></textarea>
          <section class="layout-controls" aria-label="Layout">
            <div class="layout-title-row">
              <h2>Layout</h2>
            </div>
            <div id="params-controls" class="params-controls"></div>
            <div class="layout-actions">
              <button id="reset-button" type="button">Reset</button>
              <span id="state" class="state">Loading</span>
            </div>
          </section>
          <dl class="stats">
            <div>
              <dt>Render</dt>
              <dd id="render-ms">-</dd>
            </div>
            <div>
              <dt>Threads</dt>
              <dd id="threads">-</dd>
            </div>
            <div>
              <dt>Bytecode</dt>
              <dd id="instructions">-</dd>
            </div>
            <div>
              <dt>Text Length</dt>
              <dd id="text-len">-</dd>
            </div>
          </dl>
        </section>
      </section>
    </main>
  </body>
</html>
