<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prospero Viewer</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="viewer.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="viewer-pane" aria-label="Rendered output">
        <canvas id="viewport" width="1024" height="1024"></canvas>
      </section>
      <aside class="control-pane">
        <div class="title-row">
          <h1>Prospero</h1>
          <span id="state" class="state">Loading</span>
        </div>
        <label class="field-label" for="text-input">Text</label>
        <textarea id="text-input" spellcheck="false"></textarea>
        <div class="button-row">
          <button id="render-button" type="button">Render</button>
          <button id="reset-button" type="button">Reset</button>
        </div>
        <dl class="stats">
          <div>
            <dt>Render</dt>
            <dd id="render-ms">-</dd>
          </div>
          <div>
            <dt>Threads</dt>
            <dd id="threads">-</dd>
          </div>
          <div>
            <dt>Bytecode</dt>
            <dd id="instructions">-</dd>
          </div>
          <div>
            <dt>Length</dt>
            <dd id="text-len">-</dd>
          </div>
        </dl>
      </aside>
    </main>
  </body>
</html>
